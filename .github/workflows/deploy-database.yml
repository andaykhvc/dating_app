name: Deploy database

# Applies pending migrations and loads the course content into the live
# Supabase project. Runs only when started by hand (Actions → Deploy database
# → Run workflow): a database change should never happen as a side effect of a
# merge.
#
# Before you run it: in "Use workflow from" pick the branch that has the
# migrations you want live, normally main. A branch that is behind the
# database makes the run stop with an explanation; it never breaks anything.
#
# One-time setup — see docs/deploying-the-database.md:
#   Settings → Secrets and variables → Actions → New repository secret
#   SUPABASE_DB_URL = the Session pooler connection string, password included
#                     (percent-encoded if it has special characters)
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "1. Dry run (rehearsal)? ON = only show what would change, nothing is written. OFF = really update the live database. Always run ON first."
        type: boolean
        default: true
      seed_course:
        description: "2. Also load the course content (lessons and texts in every language)? Runs after the migrations; safe to repeat, it updates rows and never duplicates them."
        type: boolean
        default: true
      mark_applied_through:
        description: "3. Leave EMPTY normally. Only fill in if a run stopped and told you to: the last migration already in the database, e.g. 9998."
        type: string
        default: ""

# Two deploys at once could both try to apply the same migration.
concurrency:
  group: deploy-database
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Migrate and seed
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Lets you require an approval before this runs, under Settings →
    # Environments → supabase-production (optional).
    environment: supabase-production
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          # Same pinned CLI as the CI workflow.
          version: "2.118.0"

      - name: Check the secret is set
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::error::Add the SUPABASE_DB_URL secret first (see docs/deploying-the-database.md)."
            exit 1
          fi

      - name: Install psql
        run: command -v psql || (sudo apt-get update -q && sudo apt-get install -y -q postgresql-client)

      - name: Migrate and seed
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          DRY_RUN: ${{ inputs.dry_run }}
          SEED_COURSE: ${{ inputs.seed_course }}
          MARK_APPLIED_THROUGH: ${{ inputs.mark_applied_through }}
        run: scripts/db/deploy.sh
